name = "dream_http_client"
version = "6.0.0"
description = "Type-safe HTTP client for Gleam with streaming support"
licences = ["MIT"]
repository = { type = "github", user = "TrustBound", repo = "dream_http_client" }
links = [
    { title = "Documentation", href = "https://hexdocs.pm/dream_http_client" },
    { title = "GitHub", href = "https://github.com/TrustBound/dream_http_client" },
]

[documentation]
pages = [
    { title = "Getting started", path = "guides/getting-started.html", source = "./docs/guides/getting-started.md" },
    { title = "Requests and responses", path = "guides/requests-and-responses.html", source = "./docs/guides/requests-and-responses.md" },
    { title = "Streaming a response", path = "guides/streaming.html", source = "./docs/guides/streaming.md" },
    { title = "Streaming to actors", path = "guides/streaming-to-actors.html", source = "./docs/guides/streaming-to-actors.md" },
    { title = "Errors", path = "guides/errors.html", source = "./docs/guides/errors.md" },
    { title = "Request settings", path = "guides/request-settings.html", source = "./docs/guides/request-settings.md" },
    { title = "Transport configuration", path = "guides/transport-configuration.html", source = "./docs/guides/transport-configuration.md" },
    { title = "Connection pools", path = "guides/connection-pools.html", source = "./docs/guides/connection-pools.md" },
    { title = "TLS and certificate authorities", path = "guides/tls-and-certificate-authorities.html", source = "./docs/guides/tls-and-certificate-authorities.md" },
    { title = "Logging", path = "guides/logging.html", source = "./docs/guides/logging.md" },
    { title = "Recording and playback", path = "guides/recording-and-playback.html", source = "./docs/guides/recording-and-playback.md" },
    { title = "Request matching and scrubbing", path = "guides/request-matching-and-scrubbing.html", source = "./docs/guides/request-matching-and-scrubbing.md" },
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.1.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.0.1 and < 4.0.0"
gleam_yielder = ">= 1.1.0 and < 2.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_crypto = ">= 1.3.0 and < 2.0.0"
gun = ">= 2.2.0 and < 3.0.0"

[erlang]
application_start_module = "dream_http_client_app"

[dev-dependencies]
dream_http_server = ">= 1.3.1 and < 2.0.0"
# Switched to a Hex version range once it is published.
dream_mock_server = { git = "https://github.com/TrustBound/dream_mock_server.git", ref = "525abd32be8cbc5f8aff33bb37d3f8ba1c7d00d1" }
# Switched to a Hex version range once it is published.
dream_test = { git = "https://github.com/TrustBound/dream_test.git", ref = "1639959578a14ae3577f8e3ae5cac058f933aa53" }
# Switched to a Hex version range once it is published.
dream_snippets = { git = "https://github.com/TrustBound/dream_snippets.git", ref = "f116b072699ec33315980418036d962e22fab872" }

[tools.dream_snippets]
checked_from_version = "6.0.0"
